    <text class="body" x="900" y="294">64 通道权重分块</text>
    <text class="body" x="900" y="347">8 路行缓存、双像素</text>
    <text class="body" x="900" y="400">分离量化写回</text>
  </g>
  <g>
    <rect class="box" x="1225" y="160" width="500" height="275" rx="9"/>
    <rect class="fill" x="1227" y="162" width="496" height="69"/>
    <text class="title" x="1475" y="208">超声任务适配</text>
    <text class="body" x="1475" y="294">配对数据与 224 输入</text>
    <text class="body" x="1475" y="347">增强保持解剖语义</text>
    <text class="body" x="1475" y="400">同图滤波配对评价</text>
