<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="580" viewBox="0 0 1800 580">
  <defs>
    <style>
      .box{fill:#fff;stroke:#586b86;stroke-width:3}
      .fill{fill:#f2f5f9}
      .line{stroke:#586b86;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .title{font:40px 'SimSun',serif;fill:#18243a;text-anchor:middle}
      .body{font:38px 'SimSun',serif;fill:#18243a;text-anchor:middle}
      .small{font:33px 'SimSun',serif;fill:#18243a;text-anchor:middle}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#586b86"/></marker>
  </defs>
  <rect class="box fill" x="65" y="30" width="1670" height="75" rx="9"/>
  <text class="title" x="900" y="81">共同约束：YOLO26n 算子图 × Zynq-7020 资源 × 超声图像任务</text>
  <path class="line" d="M325 105 V151 M900 105 V151 M1475 105 V151"/>
  <g>
    <rect class="box" x="75" y="160" width="500" height="275" rx="9"/>
    <rect class="fill" x="77" y="162" width="496" height="69"/>
    <text class="title" x="325" y="208">新版网络硬件化</text>
    <text class="body" x="325" y="294">算子依赖审计</text>
    <text class="body" x="325" y="347">注意力拟合、头部重构</text>
    <text class="body" x="325" y="400">111 层单次 PL 调用</text>
  </g>
  <g>
    <rect class="box" x="650" y="160" width="500" height="275" rx="9"/>
    <rect class="fill" x="652" y="162" width="496" height="69"/>
