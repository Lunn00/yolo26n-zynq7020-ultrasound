  <path class="line" d="M325 435 V466 M900 435 V466 M1475 435 V466"/>
  <rect class="box fill" x="75" y="475" width="1650" height="80" rx="9"/>
  <text class="small" x="900" y="526">共同验收：定位精度  |  INT8 一致性  |  资源时序  |  板上推理与显示</text>
